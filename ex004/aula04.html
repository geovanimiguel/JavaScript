<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 2em Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é seu nome')
        document.write(`Olá, <strong>${nome}</strong>. <br> Seu nome tem ${nome.length} letras.`)
        document.write(`Seu nome em maiusculo é <strong>${nome.toUpperCase()}</strong> <br>`)
        document.write(`Seu nome em minusculo é <strong>${nome.toLowerCase()}</strong>`)
    </script>
</body>
</html>
