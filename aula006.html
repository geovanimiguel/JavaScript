<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div#area {
            width: 300px;
            height: 200px;
            border: 2px solid black;
            background-color: lightgray;
            font: normal 1.2em Arial;
            text-align: center;
            line-height: 200px;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="area">
        interaja...
    </div>
    <script>
        var a = window.document.querySelector("div#area")
        a.addEventListener("click", clicar)
        a.addEventListener("mouseenter", entrar)
        a.addEventListener("mouseout", sair)
        function clicar() {
            a.innerHTML = "<strong>Clicou!</strong>"
            a.style.background = "white"
            a.style.color = "black"
        }
        function entrar() {
            a.innerText = "Entrou!"
            a.style.background = "lightblue"
            a.style.color = "white"
        }
        function sair() {
            a.innerText = "Saiu!"
            a.style.background = "lightgray"
            a.style.color = "black"
        }
    </script>
</body>
</html>
